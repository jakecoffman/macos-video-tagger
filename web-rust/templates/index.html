<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Tagger</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            color: #e0e0e0;
        }
        h1 {
            margin: 0 0 20px 0;
            color: #fff;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }
        .tab {
            padding: 10px 20px;
            background: #2a2a2a;
            border: none;
            border-radius: 8px 8px 0 0;
            color: #aaa;
            cursor: pointer;
            font-size: 14px;
        }
        .tab.active {
            background: #3a3a3a;
            color: #fff;
        }
        .tab:hover {
            background: #3a3a3a;
        }
        .panel {
            display: none;
        }
        .panel.active {
            display: block;
        }

        /* Videos Grid */
        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .video-card {
            background: #2a2a2a;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s;
        }
        .video-card:hover {
            transform: translateY(-4px);
        }
        .video-card a {
            text-decoration: none;
            color: inherit;
        }
        .video-thumbnail {
            width: 100%;
            aspect-ratio: 16/9;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .play-icon {
            font-size: 48px;
            color: rgba(255,255,255,0.3);
            position: absolute;
            pointer-events: none;
        }
        .video-card:hover .play-icon {
            color: rgba(255,255,255,0.6);
        }
        .video-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-thumbnail img.loaded {
            opacity: 1;
        }
        .video-thumbnail img.loading {
            opacity: 0;
        }
        .video-thumbnail img.loaded + .play-icon {
            display: block;
        }
        .video-info {
            padding: 15px;
        }
        .video-title {
            font-weight: 600;
            margin-bottom: 10px;
            word-break: break-word;
            color: #fff;
        }
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .tag {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        .tag.content {
            background: #2d4a2d;
            color: #7dd87d;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .tag.content:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 8px rgba(125, 216, 125, 0.3);
        }
        .tag.person {
            background: #3d3a4d;
            color: #a8a0d0;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .tag.person:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 8px rgba(168, 160, 208, 0.3);
        }

        /* Filter bar */
        .filter-bar {
            display: none;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: #2a2a2a;
            border-radius: 8px;
        }
        .filter-bar.active {
            display: flex;
        }
        .filter-bar .label {
            color: #888;
            font-size: 14px;
        }
        .filter-bar .filter-tag {
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .filter-bar .filter-tag:hover {
            opacity: 0.8;
        }
        .filter-bar .filter-tag.content {
            background: #2d4a2d;
            color: #7dd87d;
        }
        .filter-bar .filter-tag.person {
            background: #3d3a4d;
            color: #a8a0d0;
        }
        .filter-bar .clear-filter {
            margin-left: auto;
            padding: 6px 12px;
            background: #444;
            border: none;
            border-radius: 6px;
            color: #ccc;
            cursor: pointer;
            font-size: 13px;
        }
        .filter-bar .clear-filter:hover {
            background: #555;
        }
        .filter-bar .video-count {
            color: #666;
            font-size: 13px;
        }

        /* Persons Panel */
        .persons-list {
            max-width: 600px;
        }
        .person-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .person-id {
            color: #666;
            font-size: 12px;
            width: 30px;
        }
        .person-name {
            flex: 1;
            font-size: 16px;
        }
        .person-name input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #1a1a1a;
            color: #fff;
            font-size: 16px;
        }
        .person-name input:focus {
            outline: none;
            border-color: #666;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn-primary {
            background: #4a7c4a;
            color: white;
        }
        .btn-primary:hover {
            background: #5a8c5a;
        }
        .btn-secondary {
            background: #444;
            color: white;
        }
        .btn-secondary:hover {
            background: #555;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Status message */
        .status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 8px;
            background: #2d4a2d;
            color: #7dd87d;
            display: none;
        }
        .status.error {
            background: #4a2d2d;
            color: #d87d7d;
        }
        .status.show {
            display: block;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .empty-state h2 {
            color: #888;
        }
    </style>
</head>
<body>
    <h1>🎬 Video Tagger</h1>

    <div class="tabs">
        <button class="tab active" data-panel="videos">Videos</button>
        <button class="tab" data-panel="persons">People</button>
    </div>

    <div id="videos" class="panel active">
        <div id="filter-bar" class="filter-bar">
            <span class="label">Filtering by:</span>
            <span id="filter-tags"></span>
            <span id="video-count" class="video-count"></span>
            <button class="clear-filter" onclick="clearFilter()">✕ Clear all</button>
        </div>
        <div id="videos-grid" class="videos-grid">
            <!-- Videos will be loaded here -->
        </div>
    </div>

    <div id="persons" class="panel">
        <p style="color: #888; margin-bottom: 20px;">
            Rename people to update their tags across all videos.
        </p>
        <div id="persons-list" class="persons-list">
            <!-- Persons will be loaded here -->
        </div>
    </div>

    <div id="status" class="status"></div>

    <script>
        // Filter state - array of { tag: string, type: 'content' | 'person' }
        let filters = [];
        let allVideos = [];  // Cache all videos for filtering

        // Read filters from URL on page load
        function readFilterFromURL() {
            const params = new URLSearchParams(window.location.search);
            filters = [];
            // Support multiple tags: ?content=tag1,tag2&person=tag3
            const contentTags = params.get('content');
            const personTags = params.get('person');
            if (contentTags) {
                contentTags.split(',').forEach(tag => {
                    if (tag) filters.push({ tag, type: 'content' });
                });
            }
            if (personTags) {
                personTags.split(',').forEach(tag => {
                    if (tag) filters.push({ tag, type: 'person' });
                });
            }
        }

        // Update URL with current filters
        function updateURL() {
            const url = new URL(window.location);
            url.searchParams.delete('content');
            url.searchParams.delete('person');
            const contentTags = filters.filter(f => f.type === 'content').map(f => f.tag);
            const personTags = filters.filter(f => f.type === 'person').map(f => f.tag);
            if (contentTags.length) url.searchParams.set('content', contentTags.join(','));
            if (personTags.length) url.searchParams.set('person', personTags.join(','));
            history.pushState({}, '', url);
        }

        // Handle browser back/forward
        window.addEventListener('popstate', () => {
            readFilterFromURL();
            updateFilterBar();
            renderVideos();
        });

        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.panel).classList.add('active');
            });
        });

        // Toggle a tag filter (add if not present, remove if present)
        function filterByTag(tag, type, event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            const idx = filters.findIndex(f => f.tag === tag && f.type === type);
            if (idx >= 0) {
                filters.splice(idx, 1);  // Remove if already filtered
            } else {
                filters.push({ tag, type });  // Add new filter
            }
            updateURL();
            updateFilterBar();
            renderVideos();
        }

        // Remove a specific filter
        function removeFilter(tag, type) {
            filters = filters.filter(f => !(f.tag === tag && f.type === type));
            updateURL();
            updateFilterBar();
            renderVideos();
        }

        // Clear all filters
        function clearFilter() {
            filters = [];
            updateURL();
            updateFilterBar();
            renderVideos();
        }

        // Update filter bar display
        function updateFilterBar() {
            const bar = document.getElementById('filter-bar');
            const tagsEl = document.getElementById('filter-tags');
            const countEl = document.getElementById('video-count');

            if (filters.length > 0) {
                bar.classList.add('active');
                tagsEl.innerHTML = filters.map(f =>
                    `<span class="filter-tag ${f.type}" onclick="removeFilter('${escapeHtml(f.tag)}', '${f.type}')">${escapeHtml(f.tag)} ✕</span>`
                ).join(' ');

                const filtered = getFilteredVideos();
                countEl.textContent = `(${filtered.length} video${filtered.length !== 1 ? 's' : ''})`;
            } else {
                bar.classList.remove('active');
            }
        }

        // Get filtered videos (must match ALL filters)
        function getFilteredVideos() {
            if (filters.length === 0) return allVideos;

            return allVideos.filter(video => {
                return filters.every(f => {
                    if (f.type === 'content') {
                        return video.content_tags.includes(f.tag);
                    } else {
                        return video.person_tags.includes(f.tag);
                    }
                });
            });
        }

        // Render videos (filtered or all)
        function renderVideos() {
            const grid = document.getElementById('videos-grid');
            const videos = getFilteredVideos();

            if (videos.length === 0) {
                if (filters.length > 0) {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <h2>No videos match these filters</h2>
                            <p>Try removing some filters or <a href="#" onclick="clearFilter(); return false;" style="color: #7dd87d;">clear all filters</a>.</p>
                        </div>
                    `;
                } else {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <h2>No videos processed yet</h2>
                            <p>Run the video tagger on a directory first.</p>
                        </div>
                    `;
                }
                return;
            }

            grid.innerHTML = videos.map(video => `
                <div class="video-card">
                    <a href="/video/${encodeURIComponent(video.path)}">
                        <div class="video-thumbnail" data-thumbnail-url="/api/thumbnail?path=${encodeURIComponent(video.path)}">
                            <span class="play-icon">▶</span>
                        </div>
                    </a>
                    <div class="video-info">
                        <a href="/video/${encodeURIComponent(video.path)}" style="text-decoration: none; color: inherit;">
                            <div class="video-title">${escapeHtml(video.filename)}</div>
                        </a>
                        <div class="tags">
                            ${video.content_tags.map(t => `<span class="tag content" onclick="filterByTag('${escapeHtml(t)}', 'content', event)">${escapeHtml(t)}</span>`).join('')}
                            ${video.person_tags.map(t => `<span class="tag person" onclick="filterByTag('${escapeHtml(t)}', 'person', event)">${escapeHtml(t)}</span>`).join('')}
                        </div>
                    </div>
                </div>
            `).join('');

            // Observe all thumbnails for lazy loading
            grid.querySelectorAll('.video-thumbnail').forEach(thumb => {
                thumbnailObserver.observe(thumb);
            });
        }

        // Show status message
        function showStatus(message, isError = false) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.classList.toggle('error', isError);
            status.classList.add('show');
            setTimeout(() => status.classList.remove('show'), 3000);
        }

        // Lazy loading observer for thumbnail images
        const thumbnailObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const thumbnail = entry.target;
                    const thumbnailUrl = thumbnail.dataset.thumbnailUrl;
                    if (thumbnailUrl && !thumbnail.dataset.loading) {
                        thumbnail.dataset.loading = 'true';
                        const img = document.createElement('img');
                        img.className = 'loading';
                        img.alt = 'Video thumbnail';

                        img.addEventListener('load', () => {
                            img.classList.remove('loading');
                            img.classList.add('loaded');
                        });
                        img.addEventListener('error', () => {
                            // On error, show play icon only
                            img.remove();
                        });

                        thumbnail.insertBefore(img, thumbnail.firstChild);
                        img.src = thumbnailUrl;
                    }
                    thumbnailObserver.unobserve(thumbnail);
                }
            });
        }, {
            rootMargin: '100px',
            threshold: 0
        });

        // Load videos
        async function loadVideos() {
            const grid = document.getElementById('videos-grid');
            try {
                const response = await fetch('/api/videos');
                allVideos = await response.json();

                updateFilterBar();
                renderVideos();
            } catch (err) {
                grid.innerHTML = `<div class="empty-state"><h2>Error loading videos</h2><p>${err.message}</p></div>`;
            }
        }

        // Load persons
        async function loadPersons() {
            const list = document.getElementById('persons-list');
            try {
                const response = await fetch('/api/persons');
                const persons = await response.json();

                if (persons.length === 0) {
                    list.innerHTML = `
                        <div class="empty-state">
                            <h2>No people recognized yet</h2>
                            <p>Process some videos with faces first.</p>
                        </div>
                    `;
                    return;
                }

                list.innerHTML = persons.map(person => `
                    <div class="person-item" data-id="${person.id}">
                        <span class="person-id">#${person.id}</span>
                        <div class="person-name">
                            <input type="text" value="${escapeHtml(person.name)}" data-original="${escapeHtml(person.name)}">
                        </div>
                        <button class="btn btn-primary" onclick="renamePerson(${person.id}, this)" disabled>Save</button>
                    </div>
                `).join('');

                // Enable save button when name changes
                list.querySelectorAll('input').forEach(input => {
                    input.addEventListener('input', (e) => {
                        const btn = e.target.closest('.person-item').querySelector('button');
                        btn.disabled = e.target.value === e.target.dataset.original || !e.target.value.trim();
                    });
                    input.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') {
                            const btn = e.target.closest('.person-item').querySelector('button');
                            if (!btn.disabled) btn.click();
                        }
                    });
                });
            } catch (err) {
                list.innerHTML = `<div class="empty-state"><h2>Error loading persons</h2><p>${err.message}</p></div>`;
            }
        }

        // Rename person
        async function renamePerson(id, btn) {
            const item = btn.closest('.person-item');
            const input = item.querySelector('input');
            const newName = input.value.trim();

            if (!newName) return;

            btn.disabled = true;
            btn.textContent = 'Saving...';

            try {
                const response = await fetch(`/api/persons/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: newName })
                });

                const result = await response.json();

                if (response.ok) {
                    input.dataset.original = newName;
                    showStatus(`Renamed "${result.old_name}" to "${result.new_name}"`);
                    // Reload videos to show updated tags
                    loadVideos();
                } else {
                    showStatus(result.error || 'Failed to rename', true);
                }
            } catch (err) {
                showStatus('Error: ' + err.message, true);
            }

            btn.textContent = 'Save';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initial load
        readFilterFromURL();
        loadVideos();
        loadPersons();
    </script>
</body>
</html>
