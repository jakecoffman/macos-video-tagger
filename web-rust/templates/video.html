<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Details</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            color: #e0e0e0;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #888;
            text-decoration: none;
            margin-bottom: 20px;
        }
        .back-link:hover {
            color: #fff;
        }
        h1 {
            margin: 0 0 20px 0;
            color: #fff;
            font-size: 24px;
            word-break: break-word;
        }
        .video-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        video {
            width: 100%;
            max-height: 70vh;
            background: #000;
            border-radius: 12px;
        }
        .details {
            margin-top: 20px;
            padding: 20px;
            background: #2a2a2a;
            border-radius: 12px;
        }
        .section {
            margin-bottom: 20px;
        }
        .section:last-child {
            margin-bottom: 0;
        }
        .section-title {
            font-size: 14px;
            color: #888;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .tag {
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 500;
        }
        .tag.content {
            background: #2d4a2d;
            color: #7dd87d;
        }
        .tag.person {
            background: #3d3a4d;
            color: #a8a0d0;
        }
        .path {
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 13px;
            color: #888;
            word-break: break-all;
            background: #1a1a1a;
            padding: 10px;
            border-radius: 6px;
        }
        .no-tags {
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <a href="/" class="back-link">← Back to all videos</a>

        <h1 id="filename">Loading...</h1>

        <video id="video" controls autoplay>
            Your browser does not support video playback.
        </video>

        <div class="details">
            <div class="section">
                <div class="section-title">Content Tags</div>
                <div id="content-tags" class="tags">
                    <span class="no-tags">Loading...</span>
                </div>
            </div>

            <div class="section">
                <div class="section-title">People</div>
                <div id="person-tags" class="tags">
                    <span class="no-tags">Loading...</span>
                </div>
            </div>

            <div class="section">
                <div class="section-title">File Path</div>
                <div id="filepath" class="path">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        const videoPath = decodeURIComponent('{{ video_path }}');

        // Set video source directly on video element (works better cross-browser)
        const videoEl = document.getElementById('video');
        videoEl.src = '/api/video?path=' + encodeURIComponent(videoPath);

        // Set filename
        const filename = videoPath.split('/').pop();
        document.getElementById('filename').textContent = filename;
        document.title = filename + ' - Video Tagger';

        // Set filepath
        document.getElementById('filepath').textContent = videoPath;

        // Load video details
        async function loadDetails() {
            try {
                const response = await fetch('/api/videos');
                const videos = await response.json();

                const video = videos.find(v => v.path === videoPath);

                if (video) {
                    const contentTags = document.getElementById('content-tags');
                    const personTags = document.getElementById('person-tags');

                    if (video.content_tags.length > 0) {
                        contentTags.innerHTML = video.content_tags
                            .map(t => `<span class="tag content">${escapeHtml(t)}</span>`)
                            .join('');
                    } else {
                        contentTags.innerHTML = '<span class="no-tags">No content tags</span>';
                    }

                    if (video.person_tags.length > 0) {
                        personTags.innerHTML = video.person_tags
                            .map(t => `<span class="tag person">${escapeHtml(t)}</span>`)
                            .join('');
                    } else {
                        personTags.innerHTML = '<span class="no-tags">No people detected</span>';
                    }
                }
            } catch (err) {
                console.error('Error loading details:', err);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        loadDetails();
    </script>
</body>
</html>
