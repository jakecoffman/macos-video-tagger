[project]
name = "video-tagger"
version = "0.1.0"
description = "AI-powered video tagging for macOS Finder using Apple Vision and face recognition"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av>=16.0.1",
    "coremltools>=9.0",
    "face-recognition>=1.3.0",
    "face-recognition-models",
    "flask>=3.0.0",
    "insightface>=0.7.3",
    "numpy>=2.3.5",
    "onnxruntime>=1.23.2",
    "pillow>=12.0.0",
    "pyobjc-framework-quartz>=12.1",
    "pyobjc-framework-vision>=12.1",
    "setuptools>=80.9.0",
]

[tool.uv.sources]
face-recognition-models = { git = "https://github.com/ageitgey/face_recognition_models" }
